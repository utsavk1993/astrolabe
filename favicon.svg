<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 64 64">
  <!-- A miniature of the dial: bezel, three ring colours with dark gaps (so they stay
       distinct at 16px), and the red reading marker. -->
  <circle r="31" fill="#17171a"/>
  <circle r="24.5" fill="none" stroke="#2f6f9f" stroke-width="5"/>
  <circle r="16.5" fill="none" stroke="#2f8a5f" stroke-width="5"/>
  <circle r="8.5" fill="none" stroke="#c2407e" stroke-width="5"/>
  <line x1="0" y1="-30" x2="0" y2="-2" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
</svg>
